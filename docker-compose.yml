services:
  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - smarthome_network
  house_api:
    container_name: house_api
    build: 
      context: ./api/house_api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - ${HOUSE_API_APP_PORT}:8000
    depends_on:
      - db
    networks:
      - smarthome_network
  web-app:
    container_name: web-app
    build:
      context: ./web-app
      dockerfile: Dockerfile
    ports:
      - ${WEB_APP_PORT}:${WEB_APP_PORT}
    networks:
      - smarthome_network


networks:
  smarthome_network:
    driver: bridge

volumes:
  db-data: